[pytest]
# Anchor rootdir at the repo root so any invocation — the full `pytest tests/` or a
# selective `pytest tests/arena tests/sim` (CI's per-area runs) — always discovers the
# root tests/conftest.py, which puts src/ and tools/ on sys.path. Without this anchor a
# single-subdir invocation can resolve rootdir to that subdir and skip the root conftest.
testpaths = tests
