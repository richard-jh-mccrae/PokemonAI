name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Verify native engine
        run: python -c "import sys; sys.path.insert(0, 'src'); import cg.sim; print(cg.sim.lib_path)"
      - name: Bellman and retained tests
        run: python -m pytest tests -q -n auto --junitxml=reports/junit.xml --durations=10
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-report
          path: reports/
          if-no-files-found: warn

  cgpy-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Pure-Python engine parity
        env:
          CG_ENGINE: py
        run: python -m pytest tests/parity tests/bellman -q --tb=short
