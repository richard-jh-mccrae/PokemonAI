name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tool_tests: ${{ steps.plan.outputs.tool_tests }}
      sim: ${{ steps.plan.outputs.sim }}
      corrections: ${{ steps.plan.outputs.corrections }}
      src: ${{ steps.plan.outputs.src }}
      cgpy: ${{ steps.plan.outputs.cgpy }}
      docs: ${{ steps.plan.outputs.docs }}
      mirrors: ${{ steps.plan.outputs.mirrors }}
    steps:
      - uses: actions/checkout@v4
      - name: Reject CRLF blobs declared LF
        shell: bash
        run: |
          bad=$(git ls-files --eol | grep '^i/crlf' | grep 'attr/text eol=lf' || true)
          test -z "$bad" || { echo "$bad"; exit 1; }
      - id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: .github/filters.yml
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          F_GLOBAL: ${{ steps.changes.outputs.global }}
          F_TOOL_GLOBAL: ${{ steps.changes.outputs.tool_global }}
          F_RUNTIME: ${{ steps.changes.outputs.runtime }}
          F_SRC: ${{ steps.changes.outputs.src }}
          F_AGENTS: ${{ steps.changes.outputs.agents }}
          F_TOOL_ARENA: ${{ steps.changes.outputs.tool_arena }}
          F_TOOL_META_TRACKER: ${{ steps.changes.outputs.tool_meta_tracker }}
          F_TOOL_SIM: ${{ steps.changes.outputs.tool_sim }}
          F_TOOL_SUBMIT: ${{ steps.changes.outputs.tool_submit }}
          F_TOOL_AGENT_SKILLS: ${{ steps.changes.outputs.tool_agent_skills }}
          F_TOOL_UNTESTED: ${{ steps.changes.outputs.tool_untested }}
          F_CORRECTIONS: ${{ steps.changes.outputs.corrections }}
          F_CGPY: ${{ steps.changes.outputs.cgpy }}
          F_DEPRECATED: ${{ steps.changes.outputs.deprecated }}
          F_MEGA_STARMIE: ${{ steps.changes.outputs.mega_starmie }}
          F_MEGA_LUCARIO: ${{ steps.changes.outputs.mega_lucario }}
          F_DRAGAPULT_EX: ${{ steps.changes.outputs.dragapult_ex }}
          F_DOCS: ${{ steps.changes.outputs.docs }}
          F_OPERATIONAL_DATA: ${{ steps.changes.outputs.operational_data }}
          F_AUTHORING: ${{ steps.changes.outputs.authoring }}
          F_ANY: ${{ steps.changes.outputs.any }}
        run: |
          tool_tests='[]'; sim=false; corrections=false; src=false; cgpy=false; docs=false; mirrors='[]'
          add_tool_test() {
            if [ "$1" = sim ]; then sim=true; return; fi
            tool_tests=$(python -c 'import json, sys; tests = json.loads(sys.argv[1]); tool = sys.argv[2]; print(json.dumps(tests if tool in tests else tests + [tool]))' "$tool_tests" "$1")
          }
          add_mirror() {
            mirrors=$(python -c 'import json, sys; agents = json.loads(sys.argv[1]); agent = sys.argv[2]; print(json.dumps(agents if agent in agents else agents + [agent]))' "$mirrors" "$1")
          }
          enable_all() { tool_tests='["arena", "meta_tracker", "submit", "test_agent_skills.py"]'; sim=true; corrections=true; src=true; cgpy=true; docs=true; mirrors='["mega_starmie", "mega_lucario", "dragapult_ex"]'; }
          if [ "$EVENT" != 'pull_request' ] || [ "$F_TOOL_GLOBAL" = true ]; then
            enable_all
          else
            if [ "$F_GLOBAL" = true ]; then
              corrections=true; src=true; cgpy=true; docs=true; mirrors='["mega_starmie", "mega_lucario", "dragapult_ex"]'
            fi
            [ "$F_TOOL_ARENA" = true ] && add_tool_test arena
            [ "$F_TOOL_META_TRACKER" = true ] && add_tool_test meta_tracker
            [ "$F_TOOL_SIM" = true ] && add_tool_test sim
            [ "$F_TOOL_SUBMIT" = true ] && add_tool_test submit
            [ "$F_TOOL_AGENT_SKILLS" = true ] && add_tool_test test_agent_skills.py
            [ "$F_CORRECTIONS" = true ] && corrections=true
            [ "$F_SRC" = true ] && src=true
            [ "$F_AGENTS" = true ] && corrections=true
            [ "$F_CGPY" = true ] && cgpy=true
            [ "$F_DOCS" = true ] && docs=true
            if [ "$F_RUNTIME" = true ]; then
              corrections=true; src=true; cgpy=true; mirrors='["mega_starmie", "mega_lucario", "dragapult_ex"]'
            fi
            if [ "$F_MEGA_STARMIE" = true ]; then
              add_tool_test sim; src=true; add_mirror mega_starmie
            fi
            if [ "$F_MEGA_LUCARIO" = true ]; then
              add_tool_test sim; src=true; add_mirror mega_lucario
            fi
            if [ "$F_DRAGAPULT_EX" = true ]; then
              add_tool_test sim; src=true; add_mirror dragapult_ex
            fi
            known=false
            for value in "$F_GLOBAL" "$F_TOOL_GLOBAL" "$F_RUNTIME" "$F_SRC" "$F_AGENTS" "$F_TOOL_ARENA" "$F_TOOL_META_TRACKER" "$F_TOOL_SIM" "$F_TOOL_SUBMIT" "$F_TOOL_AGENT_SKILLS" "$F_TOOL_UNTESTED" "$F_CORRECTIONS" "$F_CGPY" "$F_DEPRECATED" "$F_MEGA_STARMIE" "$F_MEGA_LUCARIO" "$F_DRAGAPULT_EX" "$F_DOCS" "$F_OPERATIONAL_DATA" "$F_AUTHORING"; do
              [ "$value" = true ] && known=true
            done
            [ "$F_ANY" = true ] && [ "$known" = false ] && enable_all
          fi
          printf 'tool_tests=%s\nsim=%s\ncorrections=%s\nsrc=%s\ncgpy=%s\ndocs=%s\nmirrors=%s\n' "$tool_tests" "$sim" "$corrections" "$src" "$cgpy" "$docs" "$mirrors" >> "$GITHUB_OUTPUT"

  test-tools:
    name: tests / ${{ matrix.tool }}
    needs: plan
    if: needs.plan.outputs.tool_tests != '[]'
    runs-on: ubuntu-latest
    # A tool test must never hide for most of an Actions runner allocation.  The
    # per-test timeout below identifies the specific test; this is the backstop.
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.plan.outputs.tool_tests) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m pytest tests/${{ matrix.tool }} -q -n auto --tb=short --durations=20

  test-sim:
    name: tests / sim / ${{ matrix.shard }}
    needs: plan
    if: needs.plan.outputs.sim == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: engine
            workers: 2
            targets: >-
              tests/sim/test_audit_attacks_engine.py tests/sim/test_battle.py
              tests/sim/test_check_agent.py tests/sim/test_correction_run.py
              tests/sim/test_retreat_lock_engine.py tests/sim/test_teacher_agent.py
              tests/sim/test_teacher_review_run.py tests/sim/test_transients_engine.py
          - shard: analysis
            workers: auto
            targets: >-
              tests/sim/test_attack_override_provenance.py tests/sim/test_audit_attacks.py
              tests/sim/test_battle_result.py tests/sim/test_eval_aivat.py
              tests/sim/test_eval_report.py tests/sim/test_eval_stats.py
              tests/sim/test_generate_attack_overrides.py tests/sim/test_mirror_gate.py
              tests/sim/test_paired_ab.py tests/sim/test_record.py tests/sim/test_artifacts.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: >-
          python -m pytest ${{ matrix.targets }} -q -n ${{ matrix.workers }}
          --tb=short --durations=20

  test-corrections:
    name: tests / corrections
    needs: plan
    if: needs.plan.outputs.corrections == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Replay every one-ply Ledger correction
        run: >-
          PYTHONHASHSEED=0 python tools/train/ledger_correction_gate.py --workers 2
          --output ledger-correction-gate.json

  test-performance:
    name: tests / performance
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run real-engine decision benchmarks
        run: >-
          python -m pytest tests/ledger/test_real_engine_timing.py
          -q -s --tb=short --durations=20
      - name: Gate Teacher compute and timing on the frozen corpus
        run: >-
          python tools/train/search_timing.py run
          --jobs 2 --repetitions 3 --time-cap 120 --root-timeout 140
          --assert-baseline data/benchmarks/search_timing/teacher_live_ci_baseline.json
          --out data/search-timing-runs/ci/teacher.json
      - name: Publish search timing summary
        if: always()
        shell: bash
        run: |
          report=data/search-timing-runs/ci/teacher.gate.md
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-timing-${{ github.sha }}
          path: data/search-timing-runs/ci/
          if-no-files-found: warn
          retention-days: 30

  test-src:
    name: tests / src
    needs: plan
    if: needs.plan.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Gate Ledger readiness audit
        run: |
          python tools/train/ledger_readiness.py --json
          python tools/train/ledger_readiness.py --json --warnings-as-errors \
            --decks mega_starmie mega_lucario dragapult_ex
      - name: Run parallel source contracts
        run: >-
          python -m pytest tests/observation tests/cards tests/common
          tests/ledger tests/parity tests/scouting tests/blunder tests/train
          tests/test_import_hygiene.py tests/test_source_reachability.py
          -q -n auto --tb=short
          --ignore=tests/ledger/test_real_engine_timing.py

  test-cgpy:
    name: tests / cgpy
    needs: plan
    if: needs.plan.outputs.cgpy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CG_ENGINE: py
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run parallel cgpy contracts
        run: >-
          python -m pytest tests/parity tests/ledger -q -n auto --tb=short
          --ignore=tests/ledger/test_real_engine_timing.py

  test-docs:
    name: tests / docs
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run documentation policy contracts
        run: >-
          python -m pytest tests/test_adr_index.py tests/test_comment_budget.py
          tests/test_doc_links_resolve.py tests/test_line_endings_policy.py
          tests/test_prose_policy.py -q --tb=short

  agent-mirror:
    name: mirror / ${{ matrix.agent }}
    needs: plan
    if: needs.plan.outputs.mirrors != '[]'
    runs-on: ubuntu-latest
    # A completed Match is assessed after it returns; this is only GitHub's maximum job safeguard.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.plan.outputs.mirrors) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Five parallel mirrors; every Match <= ten minutes
        run: python tools/sim/mirror_gate.py ${{ matrix.agent }} --games 5 --workers 5 --max-match-seconds 600
