name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Newer pushes to the same ref cancel in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"          # give Windows the same UTF-8 default Linux has (cards use é, ™, …)

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Run every step through bash (Git Bash on Windows runners) so the commands below are
    # identical on both OSes — `mkdir -p`, `\` line-continuations, quoting all behave the same.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false       # report both OSes, don't cancel siblings
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]   # most recent only (dev box runs 3.11)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The committed native engine must load on the runner — cg/libcg.so on Linux, cg/cg.dll on
      # Windows (sim.py picks by os.name). Engine-backed legality/playability tests depend on it.
      # Fail fast & clearly (and print which library loaded) if it can't.
      - name: Verify native engine loads
        run: python -c "import sys; sys.path.insert(0, 'my_submissions'); import cg.sim; print('native engine loaded:', cg.sim.lib_path)"

      # Whole suite runs offline on both OSes: native engine ships in-repo, kaggle-environments is
      # a pip dep, and the Kaggle CLI is monkeypatched in tests. Enforces the .coveragerc Scouting
      # gate (fail_under=80) and emits JUnit + coverage XML as artifacts.
      - name: Run tests (JUnit + Scouting coverage gate)
        run: |
          mkdir -p reports
          python -m pytest tests/ -q \
            --junitxml=reports/junit-${{ matrix.os }}-py${{ matrix.python-version }}.xml \
            --cov=my_submissions/common/scouting \
            --cov=tools/meta_tracker \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage-${{ matrix.os }}-py${{ matrix.python-version }}.xml \
            --durations=10

      - name: Upload test & coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
