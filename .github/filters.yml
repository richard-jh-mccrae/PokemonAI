# Strict CI ownership map.  A pull request runs only the independent job(s) whose
# implementation or tests it changes; an unrecognised non-doc path fails closed in ci.yml.

global:
  - '.github/**'
  - 'requirements.txt'
  - 'pytest.ini'
  - '.coveragerc'
  - '.gitattributes'
  - 'tests/conftest.py'
  - 'tests/fixtures/**'

# Production runtime: shared code can affect all test groups and every developed agent mirror.
runtime:
  - 'src/common/**'
  - 'src/cg/**'

# Source-only tests.  `runtime` is deliberately separate above because its fan-out is wider.
src:
  - 'src/**'
  - 'tests/agents/**'
  - 'tests/bellman/**'
  - 'tests/cards/**'
  - 'tests/common/**'
  - 'tests/parity/**'
  - 'tests/scouting/**'
  - 'tests/test_import_hygiene.py'

# Agent policy changes must also preserve recorded blunder-correction contracts.
agents:
  - 'src/agents/**'

# Tool test ownership. Each filter names one independently tested tool, including
# its command-line adapters where applicable. A PR runs only that tool's tests.
tool_arena:
  - 'tools/arena/**'
  - 'tools/deck_convert.py'
  - 'tests/arena/**'

tool_meta_tracker:
  - 'tools/meta_tracker/**'
  - 'tools/deck_convert.py'
  - 'tools/deck_stealer.py'
  - 'tools/export_meta_decks.py'
  - 'tools/run_meta_tracker.py'
  - 'tools/verify_meta_cards.py'
  - 'tests/meta_tracker/**'

tool_sim:
  - 'tools/sim/**'
  - 'tests/sim/**'

tool_submit:
  - 'tools/submit/**'
  - 'tools/submit_agent.py'
  - 'tests/submit/**'

tool_agent_skills:
  - 'tools/sync_agent_skills.py'
  - '.claude/skills/**'
  - '.agents/skills/**'
  - 'tests/test_agent_skills.py'

# Correction records and their writer/reader contract form an independent component.
corrections:
  - 'data/corrections/**'
  - 'tools/train/blunder/**'
  - 'tools/train/blunder_correction.py'
  - 'tests/blunder/**'
  - 'tests/corrections/**'

# These tools have no dedicated test suite. Mark them known so a change does
# not trigger the fail-closed all-jobs fallback.
tool_untested:
  - 'tools/asserted_text.py'
  - 'tools/audit_card_functions.py'
  - 'tools/build_card_functions.py'
  - 'tools/build_scouting_artifact.py'
  - 'tools/doc_budget.py'
  - 'tools/parity/**'
  - 'tools/train/**'
  - 'tools/README.md'

# The cgpy arm is independent but must re-run whenever the shared runtime changes.
cgpy:
  - 'src/cgpy/**'
  - 'tests/parity/**'
  - 'tests/bellman/**'

# Developed-agent mirror registry.  Add one filter entry when an agent earns a mirror gate.
mega_starmie:
  - 'src/agents/mega_starmie/**'
  - 'tools/sim/mirror_gate.py'

docs:
  - 'docs/**'
  - '**/*.md'
  - 'tests/test_doc_links_resolve.py'
  - 'tests/test_line_endings_policy.py'

# Operational history does not change runtime or test inputs.
operational_data:
  - 'data/agent_history.jsonl'
  - 'data/battles.jsonl'
  - 'data/performance.jsonl'
  - 'data/submissions/**'

# Agent-authoring instructions affect development workflow, not shipped code or test inputs.
authoring:
  - '.claude/**'
  - '.agents/**'
  - 'AGENTS.md'

any:
  - '**'
